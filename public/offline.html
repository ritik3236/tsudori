<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2fa1a1" />
    <title>You're offline · Tsudori</title>
    <style>
      /* Fully self-contained: this page must render with zero network. */
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: #f3f8fd;
        color: #14202e;
        font-family:
          system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 360px;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        display: block;
        margin: 0 auto 24px;
      }
      h1 {
        font-size: 1.375rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        margin: 0 auto 28px;
        max-width: 30ch;
        line-height: 1.5;
        color: #4a5a6a;
        font-size: 0.95rem;
      }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        background: #2fa1a1;
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 12px 28px;
        border-radius: 10px;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="logo" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#2FA1A1" />
        <path
          d="M10.5 14 H21.5 V18.6 C21.5 20.5 19 21.9 16 21.9 C13 21.9 10.5 20.5 10.5 18.6 Z"
          fill="#FFFFFF"
          fill-opacity="0.85"
        />
        <path d="M16 7.5 L27 13 L16 18.5 L5 13 Z" fill="#FFFFFF" />
        <circle cx="16" cy="13" r="1.15" fill="#2FA1A1" />
        <path d="M27 13 V19" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" />
        <circle cx="27" cy="20" r="1.4" fill="#FFFFFF" />
      </svg>
      <h1>You're offline</h1>
      <p>Tsudori needs a connection to load. Check your network and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
